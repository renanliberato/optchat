[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optchat"
version = "0.1.0"
description = "One durable chat, a binary memory tree, and fresh Codex/Claude/OpenCode turns"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
optchat = "optchat.cli:main"

[tool.setuptools.package-data]
optchat = ["prompts/*.txt"]

[tool.setuptools.packages.find]
include = ["optchat*"]
